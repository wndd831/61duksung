<!-- 방명록 작성 모달 -->
<div class="guest-modal" id="guestModal">
  <div class="guest-modal-box">
  <button class="guest-modal-close" id="guestModalClose">&times;</button>
  <h3>방명록 남기기</h3>
  <input type="text" id="guestTo" placeholder="To" maxlength="12">
  <input type="text" id="guestFrom" placeholder="From" maxlength="12">
  <textarea id="guestMessage" placeholder="메시지를 남겨주세요" maxlength="80"></textarea>
  <button class="guest-submit" id="guestSubmit">붙이기</button>
