<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Book | Fold to Dot.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="load-line">
    <i class="load-dot load-dot-start"></i>
    <i class="load-dash" id="loadDash"></i>
    <i class="load-dot load-dot-end"></i>
  </div>
</div>
<div class="custom-cursor"></div>
<header class="site-header">
<a href="index.html" class="logo-badge site-logo" aria-label="Fold to Dot. 홈으로">
      <span class="logo-word">Fold to</span><span class="logo-link" aria-hidden="true"><i class="logo-dot logo-dot-start"></i><i class="logo-dash"></i><i class="logo-dot logo-dot-end"></i></span><span class="logo-word">Dot.</span>
    </a>
<nav class="main-nav" id="mainNav">
<ul>
<li><a href="about.html"><i class="nav-dot" aria-hidden="true"></i><span>ABOUT</span></a></li>
<li><a href="project.html"><i class="nav-dot" aria-hidden="true"></i><span>PROJECTS</span></a></li>
<li><a href="guestbook.html" class="active"><i class="nav-dot" aria-hidden="true"></i><span>GUEST BOOK</span></a></li>
        <li><a href="fold.html"><i class="nav-dot" aria-hidden="true"></i><span>FOLD TO <span class="nav-blank" aria-label="빈칸"></span></span></a></li>
</ul>
</nav>
<button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main>
  <section class="board-section">
    <div class="board" id="board"></div>

    <button class="add-btn" id="addBtn">+</button>
  </section>
</main>

<!-- 방명록 작성 모달 -->
<div class="guest-modal" id="guestModal">
  <!-- 작성창: 색 고르기 / 보내는 사람 / 점선 / 메시지 / 전송 -->
  <form class="guest-sheet" id="guestSheet" data-color="orange" role="dialog" aria-modal="true" aria-label="방명록 작성" novalidate>
    <div class="guest-colors" role="radiogroup" aria-label="색종이 색">
      <button type="button" class="guest-color is-active" data-color="orange" aria-label="주황" aria-pressed="true"></button>
      <button type="button" class="guest-color" data-color="blue" aria-label="파랑" aria-pressed="false"></button>
    </div>
    <input type="text" id="guestFrom" class="guest-field guest-field-from" placeholder="보내는 사람" maxlength="12" autocomplete="off">
    <hr class="guest-line">
    <textarea id="guestMessage" class="guest-field guest-field-msg" placeholder="메세지" maxlength="80"></textarea>
    <button type="submit" class="guest-send" id="guestSubmit">전송</button>
  </form>
</div>

<script src="js/script.js"></script>
</body>
</html>
